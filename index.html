<script>
(()=>{
'use strict';
const VER='v0.8 phase3';
const GATE_HASH='92ecd9c0a7b0966c845632fb0e71b992e478c299988231614ec6e503e6df9615';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const BS=Math.max(1,+(qs.get('bs')||8));

/* ---------- 合言葉 ---------- */
function norm(s){return s.trim().normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  let ok=false;
  try{ok=localStorage.getItem('wi-gate')===GATE_HASH;}catch(e){}
  if(ok){boot();return;}
  $('gate').style.display='flex';
  const go=async()=>{
    const h=await sha(norm($('gi').value));
    if(h===GATE_HASH){try{localStorage.setItem('wi-gate',h);}catch(e){} $('gate').style.display='none';boot();}
    else $('ge').textContent='違います';
  };
  $('gb').onclick=go;$('gi').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function boot(){
/* ---------- 設定 ---------- */
const WNAME=['大剣','弓','魔導書'];
const NUMS=[1,1e3,1e6,1e9,1e12];
const NUMLAB=['×1','×10³','×10⁶','×10⁹','×10¹²'];
const S={nv:0,gov:1,inv:0,num:0,panel:0,mute:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('wi-set')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('wi-set',JSON.stringify(S));}catch(e){}}
S.panel=0;
/* ---------- 武器個体・セーブ ---------- */
const TYPES=['大剣','弓','魔導書','槍','双剣'];
const RK=['C','B','A','S','Z'],RCOL=['#9aa4bd','#5fd08a','#6aa8ff','#ffb347','#ff6ad5'],RM=[1,1.7,2.9,5,9];
const ELN=['炎','水','雷','光','闇'],ELC=['#ff7a45','#4aa8ff','#ffe14a','#fff6c8','#b06cff'];
const PRE=['古びた','鍛えられた','鋭い','重厚な','流れる','静かな','烈しい','輝く','朽ちぬ','無銘の'];
const INV_MAX=150,BAG_MAX=40,LV_MAX=10;
function rng32(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const WD=new WeakMap();
function wd(w){let d=WD.get(w);if(d)return d;
  const r=rng32(w.s),a=r(),sp=r(),cr=r(),eh=r(),ee=r(),pi=r();
  const el=w.r>=1&&eh<.35+.15*w.r?Math.floor(ee*5):-1;
  d={atk:RM[w.r]*(.85+.3*a)*(1+.08*w.lv),spd:.92+.16*sp+.03*w.r,cr:.1*cr+.02*w.r,el,q:(a+sp+cr)/3,name:(el>=0?ELN[el]+'の':PRE[Math.floor(pi*PRE.length)])+TYPES[w.t]};
  WD.set(w,d);return d;}
const newSeed=()=>(Math.random()*4294967296)>>>0;
function mkW(t,r,s){return {i:0,t,r,s:s==null?newSeed():s,lv:0,lk:0};}
const price=w=>Math.round([8,30,110,450,3000][w.r]*(1+.4*w.lv));
const brk=w=>[1,3,10,40,200][w.r]+w.lv;
const enhG=w=>Math.round((w.lv+1)*[15,30,70,150,400][w.r]),enhM=w=>(w.lv+1)*[2,3,5,8,15][w.r];
function defG(){const g={v:1,up:[0,0,0,0,0],lv:1,exp:0,gold:0,mat:0,stage:1,sel:1,auto:1,runs:0,kills:0,nid:1,inv:[],eq:[1,2],pend:null};
  for(const [t,s] of [[0,101],[1,202],[2,303]]){const w=mkW(t,0,s);w.i=g.nid++;g.inv.push(w);}return g;}
const num=(v,d,lo,hi)=>typeof v==='number'&&isFinite(v)?Math.min(hi,Math.max(lo,Math.floor(v))):d;
function cleanW(o){if(!o||typeof o!=='object')return null;return {i:num(o.i,0,0,1e9),t:num(o.t,0,0,4),r:num(o.r,0,0,4),s:num(o.s,1,0,4294967295),lv:num(o.lv,0,0,LV_MAX),lk:o.lk?1:0};}
function normG(o){const g=defG(),d=o&&typeof o==='object'?o:{};
  g.up=[0,1,2,3,4].map(k=>num(Array.isArray(d.up)?d.up[k]:0,0,0,30));g.lv=num(d.lv,1,1,999);g.exp=num(d.exp,0,0,1e12);g.gold=num(d.gold,0,0,1e12);g.mat=num(d.mat,0,0,1e12);g.stage=num(d.stage,1,1,9999);g.sel=num(d.sel,1,1,g.stage);g.auto=num(d.auto,1,0,2);g.runs=num(d.runs,0,0,1e9);g.kills=num(d.kills,0,0,1e12);
  if(Array.isArray(d.inv)){const L=d.inv.map(cleanW).filter(w=>w&&w.i>0).slice(0,INV_MAX);if(L.length)g.inv=L;}
  let mx=0;for(const w of g.inv)mx=Math.max(mx,w.i);g.nid=Math.max(num(d.nid,1,1,1e9),mx+1);
  const has=id=>g.inv.some(w=>w.i===id);
  if(Array.isArray(d.eq)&&has(d.eq[0])&&has(d.eq[1])&&d.eq[0]!==d.eq[1])g.eq=[d.eq[0],d.eq[1]];else g.eq=[g.inv[0].i,(g.inv[1]||g.inv[0]).i];
  if(d.pend&&Array.isArray(d.pend.loot)){g.pend={kind:String(d.pend.kind||'resume'),loot:d.pend.loot.map(cleanW).filter(Boolean).slice(0,BAG_MAX),info:String(d.pend.info||'')};}
  return g;}
function sum(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
let saveSeq=0,G;
function gsave(){try{const d=JSON.stringify(G);saveSeq++;localStorage.setItem(saveSeq%2?'wi-sA':'wi-sB',JSON.stringify({q:saveSeq,c:sum(d),d}));}catch(e){}}
function gload(){let best=null;for(const k of['wi-sA','wi-sB']){try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&typeof o.d==='string'&&o.c===sum(o.d)&&(!best||o.q>best.q))best=o;}catch(e){}}
  if(best){saveSeq=best.q;try{return normG(JSON.parse(best.d));}catch(e){}}return null;}
G=gload();const firstRun=!G;if(!G){G=defG();gsave();}
const wById=id=>G.inv.find(w=>w.i===id);
function b64u(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function exportCode(){const d=JSON.stringify(G),u8=new TextEncoder().encode(d);let out=u8,pre='WI0';
  if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw'),wr=cs.writable.getWriter();wr.write(u8);wr.close();out=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre='WI1';}catch(e){out=u8;pre='WI0';}}
  return pre+'.'+b64u(out)+'.'+sum(d);}
async function importCode(code){const p=code.trim().split('.');if(p.length!==3||(p[0]!=='WI0'&&p[0]!=='WI1'))throw new Error('形式');let u=unb64u(p[1]);
  if(p[0]==='WI1'){const ds=new DecompressionStream('deflate-raw'),wr=ds.writable.getWriter();wr.write(u);wr.close();u=new Uint8Array(await new Response(ds.readable).arrayBuffer());}
  const d=new TextDecoder().decode(u);if(sum(d)!==p[2])throw new Error('チェックサム');return normG(JSON.parse(d));}

/* ---------- 効果音（合成） ---------- */
let AC=null;const sfxLast={};
function audioInit(){if(S.mute)return;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
addEventListener('pointerdown',audioInit);
const SFXP={hit:['square',220,90,.05,.03,.05],pick:['sine',900,1500,.06,.03,.04],kill:['triangle',300,120,.09,.04,.07],lv:['sine',600,1300,.3,.06,.2],boss:['sawtooth',140,50,.6,.07,.5],skill:['sawtooth',320,80,.25,.05,.15]};
function sfx(k){if(!AC||S.mute||AC.state!=='running')return;const P=SFXP[k],now=AC.currentTime;if(now-(sfxLast[k]||0)<P[5])return;sfxLast[k]=now;
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=P[0];o.frequency.setValueAtTime(P[1],now);o.frequency.exponentialRampToValueAtTime(P[2],now+P[3]);
  g.gain.setValueAtTime(P[4],now);g.gain.exponentialRampToValueAtTime(.0001,now+P[3]);o.start(now);o.stop(now+P[3]+.02);}
/* ---------- 画面 ---------- */
const cv=$('c'),cx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,RS=1,Z=1,VW=0,VH=390,paused=false;
function applySize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;Z=H/390;VW=W/Z;
  cv.width=Math.max(1,Math.round(W*DPR*RS));cv.height=Math.max(1,Math.round(H*DPR*RS));
  const portrait=H>W;$('rot').style.display=portrait?'flex':'none';
}
addEventListener('resize',applySize);addEventListener('orientationchange',()=>setTimeout(applySize,200));

/* ---------- 品質（自動調整） ---------- */
const LV=[{p:200,n:40,rs:1,fl:1},{p:120,n:26,rs:1,fl:1},{p:60,n:14,rs:.85,fl:0},{p:20,n:8,rs:.7,fl:0}];
let ql=0;
function setQ(l){l=Math.max(0,Math.min(3,l));if(l===ql)return;ql=l;RS=LV[l].rs;applySize();}

/* ---------- スプライト（事前描画） ---------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function blob(col,dark,r,opt){
  const s=mk(r*4,r*4),g=s.getContext('2d');g.translate(r*2,r*2);g.scale(2,2);
  g.fillStyle=dark;g.beginPath();g.ellipse(0,r*.08,r,r*.92,0,0,7);g.fill();
  g.fillStyle=col;g.beginPath();g.ellipse(0,0,r*.92,r*.82,0,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-r*.3,-r*.35,r*.28,r*.16,-.5,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-r*.3,-r*.05,r*.2,0,7);g.arc(r*.3,-r*.05,r*.2,0,7);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(-r*.27,-r*.02,r*.1,0,7);g.arc(r*.33,-r*.02,r*.1,0,7);g.fill();
  if(opt==='horn'||opt==='crown'){g.fillStyle=opt==='crown'?'#ffd34d':'#ddd';g.beginPath();g.moveTo(-r*.6,-r*.5);g.lineTo(-r*.45,-r*1.05);g.lineTo(-r*.2,-r*.7);g.moveTo(r*.6,-r*.5);g.lineTo(r*.45,-r*1.05);g.lineTo(r*.2,-r*.7);g.fill();}
  if(opt==='ear'){g.fillStyle=col;g.beginPath();g.moveTo(-r*.8,-r*.2);g.lineTo(-r*1.2,-r*.6);g.lineTo(-r*.6,-r*.55);g.moveTo(r*.8,-r*.2);g.lineTo(r*1.2,-r*.6);g.lineTo(r*.6,-r*.55);g.fill();}
  return s;

/* ---------- ループ ---------- */
let acc=0,last=performance.now(),dbgT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(paused||H>W||mode!=='battle'){last=now;return;}
  const dt=Math.min(100,now-last);
  if(now-lastRender<14.5&&!bench)return;   // 120Hz端末は60fpsで頭打ち
  last=now;
  const w0=performance.now();
  acc+=dt/1000;let steps=0;while(acc>=1/60&&steps<5&&mode==='battle'){tick(1/60);acc-=1/60;steps++;}if(steps>=5)acc=0;
  render();
  const work=performance.now()-w0;
  const fd=lastRender?now-lastRender:16.7;lastRender=now;workNow=work;
  wb[fbi]=work;governor(fd);
  if(bench)benchFrame(fd,work);
  if(now-dbgT>250){dbgT=now;dbgUpdate(now);}
}
let wsum=0;
function dbgUpdate(){
  let s=0,n=Math.min(60,fbn),mx=0;for(let i=0;i<n;i++){const v=fb[(fbi-1-i+180)%180];s+=v;if(v>mx)mx=v;}const av=n?s/n:16.7;
  let ws=0;for(let i=0;i<n;i++)ws+=wb[(fbi-1-i+180)%180];
  let na=0;for(let i=0;i<MAXA;i++)if(alife[i]>0)na++;
  $('dbg').textContent=(S.panel?(VER+'\n'+(1000/av).toFixed(0)+'fps  '+av.toFixed(1)+'ms(最大'+mx.toFixed(0)+')  処理'+(n?ws/n:0).toFixed(1)+'ms\n敵'+ealive+'/'+tnow+' 矢'+na+' 粒'+pn+' 数字'+ncount+'\n品質Q'+ql+(S.gov?'(自動)':'(固定)')+' 解像度'+RS.toFixed(2)+' DPR'+DPR+'\n'+(bench?('ベンチ '+(bench.st+1)+'/5 敵'+benchStageN()):'')):'');
}


/* ---------- 拾い物（経験値・お金・武器）---------- */
const PM=()=>(1+.03*(G.lv-1))*(1+.04*G.up[1]),MH=()=>300+20*(G.lv-1)+25*G.up[0];
const needExp=l=>Math.floor(60*Math.pow(l,1.6));
function updPow(){for(let i=0;i<2;i++){const g=wById(G.eq[i])||G.inv[0];WP[i].pow=wd(g).atk*(i?.6:1)*PM();}}
function spawnO(x,y,kd,val,w){
  let i=-1;for(let k=0;k<MAXD;k++)if(!oact[k]){i=k;break;}
  if(i<0){absorb(kd,val,w);return;}
  const a=Math.random()*6.283,sp=60+Math.random()*90;
  ox_[i]=x;oy_[i]=y;ovx[i]=Math.cos(a)*sp;ovy[i]=Math.sin(a)*sp-40;otm[i]=0;okd[i]=kd;ova[i]=val;ow[i]=w;oact[i]=1;
}
function absorb(kd,val,w){
  if(kd===0){G.exp+=Math.ceil(val*(1+.05*G.up[3]));let up=0;while(G.exp>=needExp(G.lv)){G.exp-=needExp(G.lv);G.lv++;up=1;}
    if(up){P.mhp=MH();P.hp=Math.min(P.mhp,P.hp+60);sfx('lv');updPow();toast('LEVEL UP!  Lv '+G.lv,'#ffd23f');burst(P.x,P.y,14,1,160,.6);}}
  else if(kd===1)bGold+=Math.ceil(val*(1+.05*G.up[4]));
  else{if(bag.length>=BAG_MAX){if(!bagFull){bagFull=1;toast('戦利品バッグが満杯です','#ff8a8a');}return;}
    bag.push(w);if(val>=1)toast(RK[val]+'  '+wd(w).name,RCOL[val]);if(val>=3)shake=Math.max(shake,5);sfx('pick');burst(P.x,P.y,3+val*2,6+val,90,.35);}
}
function updPick(dt){
  for(let i=0;i<MAXD;i++){if(!oact[i])continue;otm[i]+=dt;
    if(otm[i]<.3){ox_[i]+=ovx[i]*dt;oy_[i]+=ovy[i]*dt;ovx[i]*=.9;ovy[i]*=.9;}
    else{const dx=P.x-ox_[i],dy=(P.y-4)-oy_[i],d=Math.sqrt(dx*dx+dy*dy)||1,v=Math.min(1100,160+(otm[i]-.3)*1800)*dt;
      if(d<=v+8){oact[i]=0;absorb(okd[i],ova[i],ow[i]);ow[i]=null;continue;}ox_[i]+=dx/d*v;oy_[i]+=dy/d*v;}}
}
function flushPick(){for(let i=0;i<MAXD;i++)if(oact[i]){oact[i]=0;absorb(okd[i],ova[i],ow[i]);ow[i]=null;}}

function recomputePk(){const L=id=>pk[id]||0;pkSpd=1+.15*L('spd');pkDmg=1+.2*L('dmg');pkCrit=.1*L('crit');pkRng=1+.15*L('rng');pkChase=.15*L('chase');pkThun=L('thun');pkAura=L('aura');pkRegen=.015*L('regen');pkLeech=.01*L('leech');pkSkill=1/(1-.2*L('skill'));}

  const ab=(a,t,on)=>'<button class="b'+(armed===a+':'+w.i?' warn':'')+'" data-a="'+a+'"'+(on===false?' disabled':'')+'>'+t+'</button>';
  el.innerHTML='<div class="tt" style="color:'+RCOL[w.r]+'">'+RK[w.r]+'　'+d.name+(w.lv?' +'+w.lv:'')+'</div>'
   +'<div class="mut">'+TYPES[w.t]+'　属性：'+(d.el>=0?'<span style="color:'+ELC[d.el]+'">'+ELN[d.el]+'（命中時30%で'+SNAME[d.el]+'・与ダメ+15%）</span>':'なし')+'</div>'
   +'<div class="mut">比較対象 <button class="b'+(invSlot===0?' on':'')+'" data-s="0">メイン</button><button class="b'+(invSlot===1?' on':'')+'" data-s="1">サブ</button></div>'
   +row('攻撃力',ATK(w),cd?dlt(d.atk,cd.atk):'')+row('攻撃速度','×'+d.spd.toFixed(2),cd?dlt(d.spd,cd.spd):'')+row('会心率','+'+(d.cr*100).toFixed(1)+'%',cd?dlt(d.cr,cd.cr):'')
   +'<div class="st"><span>個体値</span><span>'+Math.round(d.q*100)+'%</span></div>'
   +(c&&c.t!==w.t?'<div class="mut">※種類が違う武器とは数値を比べられません</div>':'')
   +'<div class="btns">'+ab('eq',(invSlot?'サブ':'メイン')+'に装備',c?c.i!==w.i:true)
   +ab('enh',w.lv>=LV_MAX?'強化MAX':'強化 '+enhG(w)+'G+素材'+enhM(w),w.lv<LV_MAX&&G.gold>=enhG(w)&&G.mat>=enhM(w))
   +ab('lock',w.lk?'ロック解除':'ロック')
   +ab('sell',armed==='sell:'+w.i?'もう一度タップで売却':'売却 +'+price(w)+'G',can)
   +ab('brk',armed==='brk:'+w.i?'もう一度タップで分解':'分解 +素材'+brk(w),can)+'</div>';
}
function doAct(a){
  const w=wById(invSel);if(!w)return;
  if(a==='eq'){const o=1-invSlot;if(G.eq[o]===w.i)G.eq[o]=G.eq[invSlot];G.eq[invSlot]=w.i;}
  else if(a==='enh'){if(w.lv<LV_MAX&&G.gold>=enhG(w)&&G.mat>=enhM(w)){G.gold-=enhG(w);G.mat-=enhM(w);w.lv++;WD.delete(w);}}
  else if(a==='lock')w.lk^=1;
  else if(a==='sell'||a==='brk'){
    if(G.eq.indexOf(w.i)>=0||w.lk)return;
    const k=a+':'+w.i;if(armed!==k){armed=k;renderDetail();setTimeout(()=>{if(armed===k){armed='';renderDetail();}},2500);return;}
    armed='';if(a==='sell')G.gold+=price(w);else G.mat+=brk(w);G.inv.splice(G.inv.indexOf(w),1);
  }
  gsave();renderInv();
}
let rsList=[],rsAct=[];
const AUTOLAB=['おまかせ：なし','おまかせ：Cを売却','おまかせ：C・Bを売却'];
function openResult(p){
  rsList=p.loot.slice().sort((a,b)=>b.r-a.r);rsAct=rsList.map(w=>w.r<G.auto?1:0);
  $('rsTitle').textContent=p.kind==='clear'?'ステージクリア':p.kind==='dead'?'やられた':p.kind==='resume'?'前回の戦利品':'帰還';
  $('rsInfo').textContent=p.info;$('rsWarn').textContent='';renderRes();show('rs');mode='result';
}
function renderRes(){
  let g=0,m=0,k=0;
  $('rsList').innerHTML=rsList.map((w,i)=>{const a=rsAct[i];if(a===1)g+=price(w);else if(a===2)m+=brk(w);else k++;
    const lab=a===1?'売却 +'+price(w)+'G':a===2?'分解 +素材'+brk(w):'持ち帰る';
    return '<div class="it" data-k="'+i+'"><b style="color:'+RCOL[w.r]+'">'+RK[w.r]+'</b><span class="nm">'+wd(w).name+'<small class="mut"> '+TYPES[w.t]+'</small></span><span class="at">'+ATK(w)+'</span><em class="a'+a+'">'+lab+'</em></div>';}).join('')||'<div style="color:#789">戦利品はありません</div>';
  $('rsSum').textContent='持ち帰り '+k+'個　売却 +'+g+'G　分解 +素材'+m+'　（所持品 '+G.inv.length+'→'+(G.inv.length+k)+'/'+INV_MAX+'）';
  $('rsAuto').textContent=AUTOLAB[G.auto];
}
function resDone(){
  const keep=rsAct.filter(a=>!a).length;
  if(G.inv.length+keep>INV_MAX){$('rsWarn').textContent='所持品が満杯です。売却か分解を増やしてください。';return;}
  rsList.forEach((w,i)=>{if(rsAct[i]===1)G.gold+=price(w);else if(rsAct[i]===2)G.mat+=brk(w);else{w.i=G.nid++;G.inv.push(w);}});
  G.pend=null;gsave();renderMenu();show('menu');
}
const UPN=['体力','攻撃力','ドロップ運','経験値','お金'],UPD=['最大HP +25','武器の攻撃力 +4%','武器ドロップ率 +4%','経験値 +5%','お金 +5%'];
const upCost=l=>Math.round(40*Math.pow(1.35,l));
function renderTr(){
  $('trHead').innerHTML='強化所　所持金 <b>'+G.gold+'</b>G';
  $('trList').innerHTML=UPN.map((n,i)=>{const l=G.up[i],mx=l>=30,c=upCost(l);return '<div class="it" style="min-height:48px"><b style="min-width:90px">'+n+' Lv'+l+'</b><span class="nm mut">'+UPD[i]+'（今 +'+(i===0?25*l:i===1||i===2?4*l+'%':5*l+'%')+'）</span><button class="b" data-u="'+i+'"'+(mx||G.gold<c?' disabled':'')+'>'+(mx?'MAX':c+'G')+'</button></div>';}).join('');
}
$('trList').onclick=e=>{const b=e.target.closest('[data-u]');if(!b||b.disabled)return;const i=+b.dataset.u,c=upCost(G.up[i]);if(G.gold>=c&&G.up[i]<30){G.gold-=c;G.up[i]++;gsave();renderTr();}};
$('mnTr').onclick=()=>{renderTr();show('tr');};
$('trBack').onclick=()=>{renderMenu();show('menu');};
$('dtMute').onclick=()=>{S.mute^=1;save();$('dtMute').textContent='効果音：'+(S.mute?'OFF':'ON');if(!S.mute)audioInit();};
$('ivList').onclick=e=>{const t=e.target.closest('[data-i]');if(t){invSel=+t.dataset.i;armed='';renderInv();}};
$('ivDet').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.s!=null){invSlot=+b.dataset.s;renderDetail();}else if(b.dataset.a)doAct(b.dataset.a);};
$('pkC').onclick=e=>{const b=e.target.closest('[data-p]');if(b)pickPerk(b.dataset.p);};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{invFilter=+b.dataset.f;renderInv();});
$('rsList').onclick=e=>{const t=e.target.closest('[data-k]');if(t){const i=+t.dataset.k;rsAct[i]=(rsAct[i]+1)%3;renderRes();}};
$('rsAuto').onclick=()=>{G.auto=(G.auto+1)%3;rsAct=rsList.map(w=>w.r<G.auto?1:0);renderRes();};
$('rsOk').onclick=resDone;
$('mnGo').onclick=()=>{audioInit();startBattle();};
$('dtMute').textContent='効果音：'+(S.mute?'OFF':'ON');
$('mnInv').onclick=()=>{invSel=G.eq[0];invFilter=-1;armed='';renderInv();show('inv');};
$('ivBack').onclick=()=>{renderMenu();show('menu');};
$('mnPrev').onclick=()=>{G.sel=Math.max(1,G.sel-1);renderMenu();gsave();};
$('mnNext').onclick=()=>{G.sel=Math.min(G.stage,G.sel+1);renderMenu();gsave();};
$('mnDat').onclick=()=>{$('dtMsg').textContent='';show('dat');};
$('dtBack').onclick=()=>{show('menu');};
$('dtOut').onclick=async()=>{const c=await exportCode();$('dtTx').value=c;try{await navigator.clipboard.writeText(c);$('dtMsg').textContent='コードを出力してコピーしました（'+c.length+'文字）。メモ等に保存してください。';}catch(e){$('dtTx').select();$('dtMsg').textContent='コードを出力しました。長押しでコピーして保存してください。';}};
$('dtIn').onclick=async()=>{try{const g=await importCode($('dtTx').value);if(!confirm('今のデータを上書きして読み込みます。よろしいですか？'))return;G=g;gsave();renderMenu();$('dtMsg').textContent='読み込みました（所持品 '+G.inv.length+'個）。';}catch(e){$('dtMsg').textContent='読み込めませんでした（'+(e&&e.message||'形式エラー')+'）。';}};
$('dtRst').onclick=()=>{if(confirm('全データを消して最初からにします。本当によろしいですか？')&&confirm('元に戻せません。消去しますか？')){G=defG();gsave();renderMenu();$('dtMsg').textContent='初期化しました。';}};
let retArm=0;
$('bRet').onclick=()=>{if(!retArm){retArm=1;$('bRet').textContent='もう一度で帰還';$('bRet').classList.add('warn');setTimeout(()=>{retArm=0;$('bRet').textContent='帰還';$('bRet').classList.remove('warn');},2000);}else{retArm=0;$('bRet').textContent='帰還';$('bRet').classList.remove('warn');endBattle('retreat');}};

/* ---------- UI ---------- */
function showMsg(t,ms){const m=$('msg');m.textContent=t;m.style.display='flex';clearTimeout(showMsg.t);if(ms<1e8)showMsg.t=setTimeout(hideMsg,ms);}
function hideMsg(){$('msg').style.display='none';}
function syncUI(){
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.nv));
  $('bNum').textContent=NUMLAB[S.num]+' ▶';
  $('bGov').textContent='品質自動:'+(S.gov?'ON':'OFF');$('bGov').classList.toggle('on',!!S.gov);
  $('bInv').textContent='無敵:'+(S.inv?'ON':'OFF');$('bInv').classList.toggle('on',!!S.inv);
  $('body').style.display=S.panel?'flex':'none';
}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{setN(+b.dataset.n);syncUI();});
$('bNum').onclick=()=>{S.num=(S.num+1)%NUMS.length;clearE();save();syncUI();};
$('bGov').onclick=()=>{S.gov^=1;if(!S.gov)setQ(0);save();syncUI();};
$('bInv').onclick=()=>{S.inv^=1;save();syncUI();};
$('bBench').onclick=()=>{if(!bench)startBench();};
$('bHud').onclick=()=>{S.panel^=1;save();syncUI();};
$('tg').onclick=()=>{S.panel^=1;save();syncUI();};
$('rc').onclick=async()=>{try{await navigator.clipboard.writeText($('rt').value);$('rc').textContent='コピーしました';}catch(e){$('rt').select();$('rc').textContent='長押しでコピーしてください';}};
$('rx').onclick=()=>{$('res').style.display='none';$('rc').textContent='コピー';};
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();acc=0;});

applySize();syncUI();renderMenu();
if(G.pend)openResult(Object.assign({},G.pend,{kind:'resume'}));else show('menu');
if(qs.get('autobench')){startBattle();setTimeout(startBench,300);}
requestAnimationFrame(frame);
window.__wi={S,P,castSkill,WP,openPerk,pickPerk,get pk(){return pk;},ehp,get bossIdx(){return bossIdx;},get G(){return G;},startBattle,endBattle,get bag(){return bag;},get mode(){return mode;},wd,mkW,get ealive(){return ealive;},get kills(){return kills;},get bench(){return bench;}};
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
gate();
})();
</script>
