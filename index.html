<script>
(()=>{
'use strict';
const VER='v0.13.0 phase6';
const GATE_HASH='92ecd9c0a7b0966c845632fb0e71b992e478c299988231614ec6e503e6df9615';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const BS=Math.max(1,+(qs.get('bs')||8));

/* ---------- 合言葉 ---------- */
function norm(s){return s.trim().normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  let ok=false;
  try{ok=localStorage.getItem('wi-gate')===GATE_HASH;}catch(e){}
  if(ok){boot();return;}
  $('gate').style.display='flex';
  const go=async()=>{
    const h=await sha(norm($('gi').value));
    if(h===GATE_HASH){try{localStorage.setItem('wi-gate',h);}catch(e){} $('gate').style.display='none';boot();}
    else $('ge').textContent='違います';
  };
  $('gb').onclick=go;$('gi').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function boot(){
/* ---------- 設定 ---------- */
const WNAME=['大剣','弓','魔導書'];
const NUMS=[1,1e3,1e6,1e9,1e12];
const NUMLAB=['×1','×10³','×10⁶','×10⁹','×10¹²'];
const DEBUG=!!(qs.get('debug')||qs.get('autobench')||(()=>{try{return localStorage.getItem('wi-dbg');}catch(e){return 0;}})());
const S={nv:0,gov:1,inv:0,num:0,panel:0,mute:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('wi-set')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('wi-set',JSON.stringify(S));}catch(e){}}
S.panel=0;
/* ---------- 武器個体・セーブ ---------- */
const TYPES=['大剣','弓','魔導書','槍','双剣'];
const RK=['C','B','A','S','Z'],RCOL=['#9aa4bd','#5fd08a','#6aa8ff','#ffb347','#ff6ad5'],RM=[1,1.7,2.9,5,9];
const ELN=['炎','水','雷','光','闇'],ELC=['#ff7a45','#4aa8ff','#ffe14a','#fff6c8','#b06cff'];
const PRE=['古びた','鍛えられた','鋭い','重厚な','流れる','静かな','烈しい','輝く','朽ちぬ','無銘の'];
const INV_MAX=150,BAG_MAX=40,LV_MAX=10;
function rng32(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const WD=new WeakMap();
function wd(w){let d=WD.get(w);if(d)return d;
  const r=rng32(w.s),a=r(),sp=r(),cr=r(),eh=r(),ee=r(),pi=r();
  const el=w.r>=1&&eh<.35+.15*w.r?Math.floor(ee*5):-1;
  d={atk:RM[w.r]*(.85+.3*a)*(1+.08*w.lv),spd:.92+.16*sp+.03*w.r,cr:.1*cr+.02*w.r,el,q:(a+sp+cr)/3,name:(el>=0?ELN[el]+'の':PRE[Math.floor(pi*PRE.length)])+TYPES[w.t]};
  WD.set(w,d);return d;}
const newSeed=()=>(Math.random()*4294967296)>>>0;
function mkW(t,r,s){return {i:0,t,r,s:s==null?newSeed():s,lv:0,lk:0};}
const price=w=>Math.round([8,30,110,450,3000][w.r]*(1+.4*w.lv));
const brk=w=>[1,3,10,40,200][w.r]+w.lv;
const enhG=w=>Math.round((w.lv+1)*[15,30,70,150,400][w.r]),enhM=w=>(w.lv+1)*[2,3,5,8,15][w.r];
function defG(){const g={v:1,up:[0,0,0,0,0],lv:1,exp:0,gold:0,mat:0,stage:1,sel:1,auto:1,runs:0,kills:0,nid:1,inv:[],eq:[1,2],pend:null,tg:0,hd:0};

/* ---------- 生成 ---------- */
function spawnP(x,y,cl,vx,vy,life,sz){if(pn>=LV[ql].p||pn>=MAXP)return;const i=pn++;px_[i]=x;py_[i]=y;pvx[i]=vx;pvy[i]=vy;plf[i]=life;pcl[i]=cl;psz[i]=sz;}
function burst(x,y,n,cl,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.4+Math.random()*.8);spawnP(x,y,cl,Math.cos(a)*s,Math.sin(a)*s,life*(.6+Math.random()*.6),1.5+Math.random()*1.5);}}
function spawnNum(x,y,v,crit,kind){const L=LV[ql];
  if(ql>=1&&!crit&&Math.random()<(ql===1?.4:ql===2?.7:.9))return;
  if(ql>=3&&!crit)return;
  if(ncount>=L.n&&!crit)return;
  const i=nptr;nptr=(nptr+1)%MAXN;nx[i]=x+(Math.random()-.5)*14;ny[i]=y-8;nlf[i]=.75;ncr[i]=crit?1:(kind||0);nsz[i]=crit?26:(kind===2?13:16);nstr[i]=fmt(v);ncount=Math.min(MAXN,ncount+1);}
const rxcd=new Float32Array(MAXE),eel=new Uint8Array(MAXE),RXT=[];
function spawnE(ft,px,py){
  let i=-1;for(let k=0;k<MAXE;k++){const j=(eptr+k)%MAXE;if(!eact[j]){i=j;eptr=j+1;break;}}if(i<0)return;
  const rr=Math.random(),t=ft!=null?ft:rr<.5?0:rr<.8?1:rr<.94?2:3;const a=Math.random()*6.283,ca=Math.abs(Math.cos(a))+1e-4,sa=Math.abs(Math.sin(a))+1e-4,d=Math.min((VW/2+30)/ca,(VH/2+30)/sa)+Math.random()*50;
  ex[i]=px!=null?px:P.x+Math.cos(a)*d;ey[i]=px!=null?py:P.y+Math.sin(a)*d;esh[i]=1+Math.random()*2;ety[i]=t;eph[i]=Math.random()*6.283;ehp[i]=ET[t].hp*NUM()*ESC;ekx[i]=eky[i]=0;efl[i]=0;ecd[i]=0;epl[i]=0;emask[i]=0;for(let k=0;k<5;k++){stT[i*5+k]=0;stD[i*5+k]=0;}edt[i]=0;eact[i]=1;ealive++;rxcd[i]=0;eel[i]=0;lastSp=i;if(t===4){bossIdx=i;bsT=2.5;bsT2=6;bcS=0;bcT=5;}}
function clearE(){eact.fill(0);ealive=0;}
function kill(i){eact[i]=0;ealive--;kills++;ult=Math.min(100,ult+(ety[i]>=2?1.2:.25));if(eel[i]){eel[i]=0;eliteDrop(i);}if(pkLeech)P.hp=Math.min(P.mhp,P.hp+P.mhp*pkLeech);sfx('kill');if(ety[i]>=2)fxAdd(0,ex[i],ey[i],0,ET[ety[i]].r+14,.28,'#ffffff');if(ety[i]===4){bossKill=1;bossIdx=-1;const sc=1+.2*(curStage-1);spawnO(ex[i],ey[i],0,Math.ceil(120*sc),null);spawnO(ex[i],ey[i],1,Math.ceil(100*sc),null);for(let k=0;k<2;k++){const r=k===0?(curStage>=7&&Math.random()<.04?4:curStage>=4&&Math.random()<.25?3:2):(Math.random()<.5?2:1);spawnO(ex[i],ey[i],2,r,mkW(pickT(),r));}showBanner('BOSS DEFEATED',TH.boss,'#ffd23f',2.2);sfx('boss');shake=Math.max(shake,10);burst(ex[i],ey[i],30,1,260,.9);return;}
  {const t=ety[i],sc=1+.2*(curStage-1);spawnO(ex[i],ey[i],0,Math.ceil([1,1,3,10][t]*sc),null);if(Math.random()<.4)spawnO(ex[i],ey[i],1,Math.ceil([1,2,4,12][t]*sc),null);}drop(i);burst(ex[i],ey[i],ety[i]>=2?10:6,ety[i]===3?1:ety[i]===0?5:4,140,.45);}
function hitE(i,dmg,kx,ky,crit,el){
  if(emask[i]&4)dmg*=1.4;if(el>=0)dmg*=1.15;dmg*=pkDmg;sfx('hit');
  if(dmg>1e15)dmg=1e15;ehp[i]-=dmg;efl[i]=.09;ekx[i]+=kx*(ety[i]===4?.15:1);eky[i]+=ky*(ety[i]===4?.15:1);spawnNum(ex[i],ey[i]-ET[ety[i]].r,dmg,crit);
  if(ql<2)spawnSpark(ex[i],ey[i],crit?5:2,crit?1:0,crit?330:240);
  if(pn<MAXP-4)burst(ex[i],ey[i],crit?4:2,crit?1:0,90,.25);
  if(ehp[i]<=0){kill(i);return;}
  if(pkChase&&Math.random()<pkChase){const d2=dmg*.5;ehp[i]-=d2;spawnNum(ex[i],ey[i]-ET[ety[i]].r-10,d2,false);if(ehp[i]<=0){kill(i);return;}}
  if(el>=0&&Math.random()<.3){const o=i*5+el,had=emask[i]&~(1<<el);stT[o]=SDUR[el];if(SDOT[el])stD[o]=Math.max(stD[o],dmg*SDOT[el]);emask[i]|=1<<el;if(had&&rxcd[i]<=0)react(i,el,had,dmg);}}
function nearest(x,y,maxd){let b=-1,bd=maxd*maxd;for(let i=0;i<MAXE;i++){if(!eact[i])continue;const dx=ex[i]-x,dy=ey[i]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i;}}return b;}

/* ---------- 武器 ---------- */
const WP=[{sub:0,type:0,pow:1,spd:1,crb:0,el:-1,cd:.5,ph:0,orb:0,pt:1.2,pr:-1,swT:0,swA:0,swD:1,swH:.78,aim:0,rc:0,pid:0},{sub:1,type:0,pow:.6,spd:1,crb:0,el:-1,cd:.9,ph:2,orb:0,pt:2,pr:-1,swT:0,swA:0,swD:-1,swH:.78,aim:0,rc:0,pid:0}];
function setW(){for(let i=0;i<2;i++){const g=wById(G.eq[i])||G.inv[0],d=wd(g),w=WP[i];w.g=g;w.type=g.t;w.pow=d.atk*(i?.6:1)*PM();w.rk=g.r;w.sk=3+i*2;w.fr=0;w.frT=0;w.spd=d.spd;w.crb=d.cr;w.el=d.el;w.cd=.3;w.pr=-1;w.swT=0;w.rc=0;w.rd=0;w.fm=1;}}
function swing(w,R0,half0,base,kb){
  const t=nearest(P.x,P.y,260);const ang=t>=0?Math.atan2(ey[t]-P.y,ex[t]-P.x):P.face;const R=R0||118*pkRng,half=half0||.78,B=base||900,KB=kb||230;
  w.swT=.09;w.swA=ang;w.swD=-w.swD;w.swH=half;
  const sl=SL[slp];slp=(slp+1)&7;sl.a=ang;sl.d=w.swD;sl.l=sl.m=.2;sl.h=half;sl.r=R;sl.k=w.sub;sl.c=w.el>=0?ELC[w.el]:(w.sub?'#9bd0ff':'#ffffff');
  const n=query(P.x,P.y,R+30);let hits=0;
  for(let q=0;q<n;q++){const i=qbuf[q];if(!eact[i])continue;const dx=ex[i]-P.x,dy=ey[i]-P.y,rr=R+ET[ety[i]].r,d2=dx*dx+dy*dy;if(d2>rr*rr)continue;
    let da=Math.atan2(dy,dx)-ang;while(da>3.1416)da-=6.2832;while(da<-3.1416)da+=6.2832;if(Math.abs(da)>half+.15)continue;
    const d=Math.sqrt(d2)||1,crit=Math.random()<.15+w.crb+pkCrit;hitE(i,B*w.pow*NUM()*(crit?2:1),dx/d*KB,dy/d*KB,crit,w.el);hits++;}
  if(hits&&w.type!==4){hitstop=Math.max(hitstop,hits>4?2:1);shake=Math.max(shake,3+Math.min(hits,6)*.5);}
}
function shoot(w){
  const t=nearest(P.x,P.y,430);const ang=t>=0?Math.atan2(ey[t]-P.y,ex[t]-P.x):P.face;
  let i=-1;for(let k=0;k<MAXA;k++)if(alife[k]<=0){i=k;break;}if(i<0)return;
  w.aim=ang;w.rc=.1;burst(P.x+Math.cos(ang)*22,P.y+Math.sin(ang)*22,1,1,70,.12);fireArrow(w,ang,1);
}
function fireArrow(w,ang,mul){
  let i=-1;for(let k=0;k<MAXA;k++)if(alife[k]<=0){i=k;break;}if(i<0)return;
  ax[i]=P.x;ay[i]=P.y;avx[i]=Math.cos(ang)*780;avy[i]=Math.sin(ang)*780;alife[i]=.75;apr[i]=4;acr[i]=w.crb+pkCrit;ael[i]=w.el;arrowCol=w.el>=0?ELC[w.el]:'#ffe9a8';adm[i]=260*w.pow*NUM()*mul;for(let k=0;k<4;k++)ahit[i*4+k]=-1;
}
const FX=[];for(let i=0;i<40;i++)FX.push({t:0,x:0,y:0,a:0,r:0,l:0,m:.3,c:'#fff'});let fxp=0;const DLY=[];
function fxAdd(t,x,y,a,r,m,c){const f=FX[fxp];fxp=(fxp+1)%40;f.t=t;f.x=x;f.y=y;f.a=a;f.r=r;f.l=f.m=m;f.c=c;}
function aoe(x,y,r,dmg,cr,el,kb){const n=query(x,y,r+30);let h=0;
  for(let q=0;q<n;q++){const i=qbuf[q];if(!eact[i])continue;const dx=ex[i]-x,dy=ey[i]-y,rr=r+ET[ety[i]].r;if(dx*dx+dy*dy>rr*rr)continue;const d=Math.sqrt(dx*dx+dy*dy)||1,crit=Math.random()<cr;hitE(i,dmg*(crit?2:1),dx/d*kb,dy/d*kb,crit,el);h++;}return h;}
function lineHit(x,y,a,len,wid,dmg,cr,el,kb){const ca=Math.cos(a),sa=Math.sin(a),n=query(x+ca*len/2,y+sa*len/2,len/2+wid+30);let h=0;
  for(let q=0;q<n;q++){const i=qbuf[q];if(!eact[i])continue;const dx=ex[i]-x,dy=ey[i]-y,al=dx*ca+dy*sa,pp=-dx*sa+dy*ca,r=ET[ety[i]].r;if(al<-r||al>len+r||Math.abs(pp)>wid+r)continue;const crit=Math.random()<cr;hitE(i,dmg*(crit?2:1),ca*kb,sa*kb,crit,el);h++;}
  if(h)hitstop=Math.max(hitstop,1);return h;}

/* ---------- 属性反応 ---------- */
const RXD={1:['蒸発','s',6,'#ffd6a0'],2:['過負荷','a',5,'#ff9a3c',95],3:['灼光','a',4,'#fff0b0',80],4:['業火毒爆','a',5,'#b06cff',90],7:['感電伝導','c',3,'#ffe14a',5],8:['屈折','c',3,'#bff0ff',4],9:['凍毒','f',2,'#9bd0ff',120],13:['閃光','a',3,'#fff6c8',110],14:['崩壊','s',7,'#d58cff'],19:['消滅','a',5,'#e8d0ff',100]};
function react(i,el,had,dmg){
  let j=0;while(!(had>>j&1))j++;
  const a=Math.min(el,j),b=Math.max(el,j),d=RXD[a*5+b];if(!d)return;
  const x=ex[i],y=ey[i],dm=dmg*d[2];
  for(const k of [a,b]){stT[i*5+k]=0;stD[i*5+k]=0;emask[i]&=~(1<<k);}
  rxcd[i]=.6;ult=Math.min(100,ult+2);
  RXT.push({t:d[0],x:x,y:y-ET[ety[i]].r-20,l:.9,c:d[3]});if(RXT.length>5)RXT.shift();
  if(!rxSeen){rxSeen=1;toast('属性反応！ 違う属性の状態異常が重なると発動','#ffd23f',3.2);}
  if(d[1]==='s'){fxAdd(0,x,y,0,46,.35,d[3]);hitE(i,dm,0,0,true,-1);}
  else if(d[1]==='a'){fxAdd(0,x,y,0,d[4],.4,d[3]);aoe(x,y,d[4],dm,0,-1,200);shake=Math.max(shake,5);if(a===3&&b===4)P.hp=Math.min(P.mhp,P.hp+P.mhp*.02);}
  else if(d[1]==='c'){const n=query(x,y,190);let c=0;for(let q=0;q<n&&c<d[4];q++){const t=qbuf[q];if(t===i||!eact[t])continue;fxAdd(1,x,y,Math.atan2(ey[t]-y,ex[t]-x),Math.hypot(ex[t]-x,ey[t]-y),.2,d[3]);hitE(t,dm,0,0,false,-1);c++;}hitE(i,dm,0,0,false,-1);}
  else{fxAdd(0,x,y,0,d[4],.4,d[3]);const n=query(x,y,d[4]+20);for(let q=0;q<n;q++){const t=qbuf[q];if(!eact[t])continue;stT[t*5+1]=SDUR[1];emask[t]|=2;}aoe(x,y,d[4],dm,0,-1,60);}
}

function manSkill(wi){const w=WP[wi];if(mode!=='battle'||P.dead||endT>0||w.sk>0)return false;skMul=1.7;castSkill(w);skMul=1;w.sk=SKCD[w.type];w.rd=0;ult=Math.min(100,ult+9);return true;}

function rollR(m){const st=curStage,bw=[100,(28+3*st)*m,(8+3*st)*m,Math.max(0,st-3)*.6*m,Math.max(0,st-6)*.04*m];if(hd)for(let k=1;k<5;k++)bw[k]*=[1,1.5,2.2][hd];
  let x=Math.random()*(bw[0]+bw[1]+bw[2]+bw[3]+bw[4]),r=0;while(r<4&&x>=bw[r]){x-=bw[r];r++;}return r;}

function castSkill(w){

   +row('攻撃力',ATK(w),cd?dlt(d.atk,cd.atk):'')+row('攻撃速度','×'+d.spd.toFixed(2),cd?dlt(d.spd,cd.spd):'')+row('会心率','+'+(d.cr*100).toFixed(1)+'%',cd?dlt(d.cr,cd.cr):'')
   +'<div class="st"><span>個体値</span><span>'+Math.round(d.q*100)+'%</span></div>'
   +(c&&c.t!==w.t?'<div class="mut">※種類が違う武器とは数値を比べられません</div>':'')
   +'<div class="btns">'+ab('eq',(invSlot?'サブ':'メイン')+'に装備',c?c.i!==w.i:true)
   +ab('enh',w.lv>=LV_MAX?'強化MAX':'強化 '+enhG(w)+'G+素材'+enhM(w),w.lv<LV_MAX&&G.gold>=enhG(w)&&G.mat>=enhM(w))
   +ab('lock',w.lk?'ロック解除':'ロック')
   +ab('sell',armed==='sell:'+w.i?'もう一度タップで売却':'売却 +'+price(w)+'G',can)
   +ab('brk',armed==='brk:'+w.i?'もう一度タップで分解':'分解 +素材'+brk(w),can)+'</div>';
}
function doAct(a){
  const w=wById(invSel);if(!w)return;
  if(a==='eq'){const o=1-invSlot;if(G.eq[o]===w.i)G.eq[o]=G.eq[invSlot];G.eq[invSlot]=w.i;}
  else if(a==='enh'){if(w.lv<LV_MAX&&G.gold>=enhG(w)&&G.mat>=enhM(w)){G.gold-=enhG(w);G.mat-=enhM(w);w.lv++;WD.delete(w);}}
  else if(a==='lock')w.lk^=1;
  else if(a==='sell'||a==='brk'){
    if(G.eq.indexOf(w.i)>=0||w.lk)return;
    const k=a+':'+w.i;if(armed!==k){armed=k;renderDetail();setTimeout(()=>{if(armed===k){armed='';renderDetail();}},2500);return;}
    armed='';if(a==='sell')G.gold+=price(w);else G.mat+=brk(w);G.inv.splice(G.inv.indexOf(w),1);
  }
  gsave();renderInv();
}
let rsList=[],rsAct=[];
const AUTOLAB=['おまかせ：なし','おまかせ：Cを売却','おまかせ：C・Bを売却'];
function openResult(p){
  rsList=p.loot.slice().sort((a,b)=>b.r-a.r);rsAct=rsList.map(w=>w.r<G.auto?1:0);
  $('rsTitle').textContent=p.kind==='clear'?'ステージクリア':p.kind==='dead'?'やられた':p.kind==='resume'?'前回の戦利品':'帰還';
  $('rsInfo').textContent=p.info;$('rsWarn').textContent='';renderRes();show('rs');mode='result';
}
function renderRes(){
  let g=0,m=0,k=0;
  $('rsList').innerHTML=rsList.map((w,i)=>{const a=rsAct[i];if(a===1)g+=price(w);else if(a===2)m+=brk(w);else k++;
    const lab=a===1?'売却 +'+price(w)+'G':a===2?'分解 +素材'+brk(w):'持ち帰る';
    return rowOf(w,'<span class="at">'+ATK(w)+'</span><em class="a'+a+'">'+lab+'</em>','data-k="'+i+'"');}).join('')||'<div style="color:#789">戦利品はありません</div>';
  $('rsSum').textContent='持ち帰り '+k+'個　売却 +'+g+'G　分解 +素材'+m+'　（所持品 '+G.inv.length+'→'+(G.inv.length+k)+'/'+INV_MAX+'）';
  $('rsAuto').textContent=AUTOLAB[G.auto];
}
function resDone(){
  const keep=rsAct.filter(a=>!a).length;
  if(G.inv.length+keep>INV_MAX){$('rsWarn').textContent='所持品が満杯です。売却か分解を増やしてください。';return;}
  rsList.forEach((w,i)=>{if(rsAct[i]===1)G.gold+=price(w);else if(rsAct[i]===2)G.mat+=brk(w);else{w.i=G.nid++;G.inv.push(w);}});
  G.pend=null;gsave();renderMenu();show('menu');
}
const UPN=['体力','攻撃力','ドロップ運','経験値','お金'],UPD=['最大HP +25','武器の攻撃力 +4%','武器ドロップ率 +4%','経験値 +5%','お金 +5%'];
const upCost=l=>Math.round(40*Math.pow(1.35,l));
function renderTr(){
  $('trHead').innerHTML='強化所　所持金 <b>'+G.gold+'</b>G';
  $('trList').innerHTML=UPN.map((n,i)=>{const l=G.up[i],mx=l>=30,c=upCost(l);return '<div class="it" style="min-height:48px"><b style="min-width:90px">'+n+' Lv'+l+'</b><span class="nm mut">'+UPD[i]+'（今 +'+(i===0?25*l:i===1||i===2?4*l+'%':5*l+'%')+'）</span><button class="b" data-u="'+i+'"'+(mx||G.gold<c?' disabled':'')+'>'+(mx?'MAX':c+'G')+'</button></div>';}).join('');
}
$('trList').onclick=e=>{const b=e.target.closest('[data-u]');if(!b||b.disabled)return;const i=+b.dataset.u,c=upCost(G.up[i]);if(G.gold>=c&&G.up[i]<30){G.gold-=c;G.up[i]++;gsave();renderTr();}};
$('mnTr').onclick=()=>{renderTr();show('tr');};
$('trBack').onclick=()=>{renderMenu();show('menu');};
$('dtBgm').onclick=()=>{BGON^=1;try{localStorage.setItem('wi-bgm',BGON?'1':'0');}catch(e){}$('dtBgm').textContent='BGM：'+(BGON?'ON':'OFF');if(BGON)audioInit();};
$('dtBgm').textContent='BGM：'+(BGON?'ON':'OFF');
$('dtMute').onclick=()=>{S.mute^=1;save();$('dtMute').textContent='効果音：'+(S.mute?'OFF':'ON');if(!S.mute)audioInit();};
$('ivList').onclick=e=>{const t=e.target.closest('[data-i]');if(t){invSel=+t.dataset.i;armed='';renderInv();}};
$('ivDet').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.s!=null){invSlot=+b.dataset.s;renderDetail();}else if(b.dataset.a)doAct(b.dataset.a);};
$('pkC').onclick=e=>{const b=e.target.closest('[data-p]');if(b)pickPerk(b.dataset.p);};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{invFilter=+b.dataset.f;renderInv();});
$('rsList').onclick=e=>{const t=e.target.closest('[data-k]');if(t){const i=+t.dataset.k;rsAct[i]=(rsAct[i]+1)%3;renderRes();}};
$('rsAuto').onclick=()=>{G.auto=(G.auto+1)%3;rsAct=rsList.map(w=>w.r<G.auto?1:0);renderRes();};
$('rsOk').onclick=resDone;
$('mnTg').onclick=()=>{G.tg=(G.tg+1)%6;renderMenu();gsave();};
$('mnHd').onclick=()=>{G.hd=(G.hd+1)%3;renderMenu();gsave();};
$('mnGo').onclick=()=>{audioInit();startBattle();};
$('dtMute').textContent='効果音：'+(S.mute?'OFF':'ON');
$('mnInv').onclick=()=>{invSel=G.eq[0];invFilter=-1;armed='';renderInv();show('inv');};
$('ivBack').onclick=()=>{renderMenu();show('menu');};
$('mnPrev').onclick=()=>{G.sel=Math.max(1,G.sel-1);renderMenu();gsave();};
$('mnNext').onclick=()=>{G.sel=Math.min(G.stage,G.sel+1);renderMenu();gsave();};
$('mnDat').onclick=()=>{$('dtMsg').textContent='';show('dat');};
$('dtBack').onclick=()=>{show('menu');};
$('dtOut').onclick=async()=>{const c=await exportCode();$('dtTx').value=c;try{await navigator.clipboard.writeText(c);$('dtMsg').textContent='コードを出力してコピーしました（'+c.length+'文字）。メモ等に保存してください。';}catch(e){$('dtTx').select();$('dtMsg').textContent='コードを出力しました。長押しでコピーして保存してください。';}};
$('dtIn').onclick=async()=>{try{const g=await importCode($('dtTx').value);if(!confirm('今のデータを上書きして読み込みます。よろしいですか？'))return;G=g;gsave();renderMenu();$('dtMsg').textContent='読み込みました（所持品 '+G.inv.length+'個）。';}catch(e){$('dtMsg').textContent='読み込めませんでした（'+(e&&e.message||'形式エラー')+'）。';}};
$('dtRst').onclick=()=>{if(confirm('全データを消して最初からにします。本当によろしいですか？')&&confirm('元に戻せません。消去しますか？')){G=defG();gsave();renderMenu();$('dtMsg').textContent='初期化しました。';}};
let retArm=0;
$('bRet').onclick=()=>{if(!retArm){retArm=1;$('bRet').textContent='もう一度で帰還';$('bRet').classList.add('warn');setTimeout(()=>{retArm=0;$('bRet').textContent='帰還';$('bRet').classList.remove('warn');},2000);}else{retArm=0;$('bRet').textContent='帰還';$('bRet').classList.remove('warn');endBattle('retreat');}};

/* ---------- UI ---------- */
function showMsg(t,ms){const m=$('msg');m.textContent=t;m.style.display='flex';clearTimeout(showMsg.t);if(ms<1e8)showMsg.t=setTimeout(hideMsg,ms);}
function hideMsg(){$('msg').style.display='none';}
function syncUI(){
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.nv));
  $('bNum').textContent=NUMLAB[S.num]+' ▶';
  $('bGov').textContent='品質自動:'+(S.gov?'ON':'OFF');$('bGov').classList.toggle('on',!!S.gov);
  $('bInv').textContent='無敵:'+(S.inv?'ON':'OFF');$('bInv').classList.toggle('on',!!S.inv);
  $('body').style.display=(DEBUG&&S.panel)?'flex':'none';$('tg').style.display=DEBUG?'':'none';
}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{setN(+b.dataset.n);syncUI();});
$('bNum').onclick=()=>{S.num=(S.num+1)%NUMS.length;clearE();save();syncUI();};
$('bGov').onclick=()=>{S.gov^=1;if(!S.gov)setQ(0);save();syncUI();};
$('bInv').onclick=()=>{S.inv^=1;save();syncUI();};
$('bBench').onclick=()=>{if(!bench)startBench();};
$('bHud').onclick=()=>{S.panel^=1;save();syncUI();};
$('tg').onclick=()=>{S.panel^=1;save();syncUI();};
$('rc').onclick=async()=>{try{await navigator.clipboard.writeText($('rt').value);$('rc').textContent='コピーしました';}catch(e){$('rt').select();$('rc').textContent='長押しでコピーしてください';}};
$('rx').onclick=()=>{$('res').style.display='none';$('rc').textContent='コピー';};
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();acc=0;});

applySize();syncUI();renderMenu();
if(G.pend)openResult(Object.assign({},G.pend,{kind:'resume'}));else show('menu');
if(qs.get('autobench')){startBattle();setTimeout(startBench,300);}
requestAnimationFrame(frame);
window.__wi={S,P,ex,ey,get bcS(){return bcS;},castSkill,manSkill,ultCast,react,runEvent,get ult(){return ult;},set ult(v){ult=v;},get chest(){return chest;},WP,openPerk,pickPerk,get pk(){return pk;},ehp,get bossIdx(){return bossIdx;},get G(){return G;},startBattle,endBattle,get bag(){return bag;},get mode(){return mode;},wd,mkW,get ealive(){return ealive;},get kills(){return kills;},get bench(){return bench;}};
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
gate();
})();
