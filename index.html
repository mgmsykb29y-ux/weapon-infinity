<script>
(()=>{
'use strict';
const VER='v0.2 phase1';
const GATE_HASH='92ecd9c0a7b0966c845632fb0e71b992e478c299988231614ec6e503e6df9615';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const BS=Math.max(1,+(qs.get('bs')||8));

/* ---------- 合言葉 ---------- */
function norm(s){return s.trim().normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function gate(){
  let ok=false;
  try{ok=localStorage.getItem('wi-gate')===GATE_HASH;}catch(e){}
  if(ok){boot();return;}
  $('gate').style.display='flex';
  const go=async()=>{
    const h=await sha(norm($('gi').value));
    if(h===GATE_HASH){try{localStorage.setItem('wi-gate',h);}catch(e){} $('gate').style.display='none';boot();}
    else $('ge').textContent='違います';
  };
  $('gb').onclick=go;$('gi').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function boot(){
/* ---------- 設定 ---------- */
const WNAME=['大剣','弓','魔導書'];
const NUMS=[1,1e3,1e6,1e9,1e12];
const NUMLAB=['×1','×10³','×10⁶','×10⁹','×10¹²'];
const S={main:0,sub:1,n:60,gov:1,inv:0,num:0,panel:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('wi-set')||'{}'));}catch(e){}
function save(){try{localStorage.setItem('wi-set',JSON.stringify(S));}catch(e){}}

/* ---------- 画面 ---------- */
const cv=$('c'),cx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,RS=1,Z=1,VW=0,VH=390,paused=false;
function applySize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;Z=H/390;VW=W/Z;
  cv.width=Math.max(1,Math.round(W*DPR*RS));cv.height=Math.max(1,Math.round(H*DPR*RS));
  const portrait=H>W;$('rot').style.display=portrait?'flex':'none';
}
addEventListener('resize',applySize);addEventListener('orientationchange',()=>setTimeout(applySize,200));

/* ---------- 品質（自動調整） ---------- */
const LV=[{p:200,n:40,rs:1,fl:1},{p:120,n:26,rs:1,fl:1},{p:60,n:14,rs:.85,fl:0},{p:20,n:8,rs:.7,fl:0}];
let ql=0;
function setQ(l){l=Math.max(0,Math.min(3,l));if(l===ql)return;ql=l;RS=LV[l].rs;applySize();}

/* ---------- スプライト（事前描画） ---------- */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function blob(col,dark,r,opt){
  const s=mk(r*4,r*4),g=s.getContext('2d');g.translate(r*2,r*2);g.scale(2,2);
  g.fillStyle=dark;g.beginPath();g.ellipse(0,r*.08,r,r*.92,0,0,7);g.fill();
  g.fillStyle=col;g.beginPath();g.ellipse(0,0,r*.92,r*.82,0,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-r*.3,-r*.35,r*.28,r*.16,-.5,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(-r*.3,-r*.05,r*.2,0,7);g.arc(r*.3,-r*.05,r*.2,0,7);g.fill();
  g.fillStyle='#111';g.beginPath();g.arc(-r*.27,-r*.02,r*.1,0,7);g.arc(r*.33,-r*.02,r*.1,0,7);g.fill();
  if(opt==='horn'||opt==='crown'){g.fillStyle=opt==='crown'?'#ffd34d':'#ddd';g.beginPath();g.moveTo(-r*.6,-r*.5);g.lineTo(-r*.45,-r*1.05);g.lineTo(-r*.2,-r*.7);g.moveTo(r*.6,-r*.5);g.lineTo(r*.45,-r*1.05);g.lineTo(r*.2,-r*.7);g.fill();}
  if(opt==='ear'){g.fillStyle=col;g.beginPath();g.moveTo(-r*.8,-r*.2);g.lineTo(-r*1.2,-r*.6);g.lineTo(-r*.6,-r*.55);g.moveTo(r*.8,-r*.2);g.lineTo(r*1.2,-r*.6);g.lineTo(r*.6,-r*.55);g.fill();}
  return s;
}
function flashOf(s){const f=mk(s.width,s.height),g=f.getContext('2d');g.drawImage(s,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);return f;}
const ET=[ // hp, spd, r, dmg
  {hp:1500,sp:62,r:11,d:14,spr:blob('#5ddc7b','#2a8a4a',11)},
  {hp:1000,sp:92,r:9,d:10,spr:blob('#b5a24a','#6b5d22',9,'ear')},
  {hp:6000,sp:52,r:16,d:24,spr:blob('#c8505a','#7a2630',16,'horn')},
  {hp:20000,sp:70,r:22,d:38,spr:blob('#6a5dff','#34288f',22,'crown')}];
for(const t of ET)t.fl=flashOf(t.spr);
const TILE=(()=>{const s=mk(256,256),g=s.getContext('2d');g.fillStyle='#10131f';g.fillRect(0,0,256,256);
  g.strokeStyle='#161b2e';g.lineWidth=2;g.strokeRect(1,1,254,254);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<40;i++){g.fillStyle=rnd()<.5?'#151a2b':'#0d1019';g.fillRect(rnd()*250,rnd()*250,2+rnd()*4,2+rnd()*3);}
  return s;})();
const GLOW=(()=>{const s=mk(64,64),g=s.getContext('2d'),gr=g.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(190,140,255,.9)');gr.addColorStop(1,'rgba(120,60,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return s;})();
/* 武器スプライト（仮のイラスト。正式版は後で差し替え） */
const SWORD=(()=>{const s=mk(200,60),g=s.getContext('2d');g.translate(0,30);
  const bg=g.createLinearGradient(0,-12,0,12);bg.addColorStop(0,'#ffffff');bg.addColorStop(.5,'#c9d4f2');bg.addColorStop(1,'#7f8fbf');
  g.fillStyle=bg;g.beginPath();g.moveTo(52,-11);g.lineTo(170,-11);g.lineTo(198,0);g.lineTo(170,11);g.lineTo(52,11);g.closePath();g.fill();
  g.strokeStyle='#3b4770';g.lineWidth=2;g.stroke();
  g.strokeStyle='rgba(60,80,150,.55)';g.beginPath();g.moveTo(60,0);g.lineTo(176,0);g.stroke();
  g.fillStyle='#e2b84a';g.strokeStyle='#7a5a12';g.beginPath();g.rect(40,-24,14,48);g.fill();g.stroke();
  g.fillStyle='#c8362f';g.beginPath();g.arc(47,0,4,0,7);g.fill();
  g.fillStyle='#5a3a22';g.fillRect(12,-5,28,10);g.strokeStyle='#2b1a0e';g.strokeRect(12,-5,28,10);
  g.strokeStyle='#8a5e38';for(let x=16;x<40;x+=6){g.beginPath();g.moveTo(x,-5);g.lineTo(x+3,5);g.stroke();}
  g.fillStyle='#e2b84a';g.strokeStyle='#7a5a12';g.beginPath();g.arc(8,0,8,0,7);g.fill();g.stroke();return s;})();
const BOW=(()=>{const s=mk(64,128),g=s.getContext('2d');g.lineCap='round';
  g.strokeStyle='#3a2414';g.lineWidth=8;g.beginPath();g.moveTo(14,6);g.quadraticCurveTo(58,64,14,122);g.stroke();
  g.strokeStyle='#b07a42';g.lineWidth=4;g.beginPath();g.moveTo(14,6);g.quadraticCurveTo(58,64,14,122);g.stroke();
  g.strokeStyle='#f3efe0';g.lineWidth=1.6;g.beginPath();g.moveTo(14,6);g.lineTo(14,122);g.stroke();
  g.fillStyle='#e2b84a';g.fillRect(31,57,8,14);return s;})();
const TOME=(()=>{const s=mk(96,72),g=s.getContext('2d');
  g.fillStyle='#3a1d7a';g.strokeStyle='#e2b84a';g.lineWidth=3;g.beginPath();g.roundRect(4,8,88,58,8);g.fill();g.stroke();
  g.fillStyle='#f6efd8';g.beginPath();g.moveTo(10,14);g.quadraticCurveTo(30,8,48,16);g.lineTo(48,60);g.quadraticCurveTo(30,52,10,58);g.closePath();g.fill();
  g.beginPath();g.moveTo(86,14);g.quadraticCurveTo(66,8,48,16);g.lineTo(48,60);g.quadraticCurveTo(66,52,86,58);g.closePath();g.fill();
  g.strokeStyle='#8a4bff';g.lineWidth=2;g.beginPath();g.arc(48,36,11,0,7);g.stroke();
  g.beginPath();g.moveTo(48,25);g.lineTo(55,43);g.lineTo(41,31);g.lineTo(55,31);g.lineTo(41,43);g.closePath();g.stroke();return s;})();
/* 数字アトラス */
const CH='0123456789.KMBTQ';const CW=22,CHH=36;
function atlas(col){const s=mk(CW*CH.length,CHH),g=s.getContext('2d');g.font='bold 30px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=5;g.strokeStyle='#000';
  for(let i=0;i<CH.length;i++){g.strokeText(CH[i],i*CW+CW/2,CHH/2+1);}g.fillStyle=col;for(let i=0;i<CH.length;i++)g.fillText(CH[i],i*CW+CW/2,CHH/2+1);return s;}
const AT=[atlas('#ffffff'),atlas('#ffd23f')];
const CMAP=new Int8Array(128).fill(-1);for(let i=0;i<CH.length;i++)CMAP[CH.charCodeAt(i)]=i;
function fmt(v){if(v<1000)return String(Math.floor(v));const u=['K','M','B','T','Q'];let i=-1;while(v>=1000&&i<4){v/=1000;i++;}return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v).toString())+u[i];}

/* ---------- エンティティ（SoA） ---------- */
const MAXE=400,MAXA=120,MAXP=260,MAXN=60;
const ex=new Float32Array(MAXE),ey=new Float32Array(MAXE),ehp=new Float64Array(MAXE),ekx=new Float32Array(MAXE),eky=new Float32Array(MAXE),efl=new Float32Array(MAXE),eph=new Float32Array(MAXE),ecd=new Float32Array(MAXE),epl=new Uint16Array(MAXE),ety=new Uint8Array(MAXE),eact=new Uint8Array(MAXE);
let ealive=0,eptr=0;
const ax=new Float32Array(MAXA),ay=new Float32Array(MAXA),avx=new Float32Array(MAXA),avy=new Float32Array(MAXA),alife=new Float32Array(MAXA),apr=new Uint8Array(MAXA),adm=new Float64Array(MAXA),ahit=new Int16Array(MAXA*4);
const px_=new Float32Array(MAXP),py_=new Float32Array(MAXP),pvx=new Float32Array(MAXP),pvy=new Float32Array(MAXP),plf=new Float32Array(MAXP),pcl=new Uint8Array(MAXP),psz=new Float32Array(MAXP);let pn=0;
const PCOL=['#fff','#ffd23f','#9bd0ff','#d79bff','#ff8a8a','#8aff9b'];
const nx=new Float32Array(MAXN),ny=new Float32Array(MAXN),nlf=new Float32Array(MAXN),nsz=new Float32Array(MAXN),ncr=new Uint8Array(MAXN),nstr=new Array(MAXN).fill('');let nptr=0,ncount=0;
const SL=[];for(let i=0;i<8;i++)SL.push({a:0,d:1,l:0,m:.26,h:.8,r:100,k:0});let slp=0;

/* ---------- 空間ハッシュ ---------- */
const GC=48,GSZ=1024,ghead=new Int32Array(GSZ),gnext=new Int32Array(MAXE),stamp=new Uint32Array(MAXE),qbuf=new Int32Array(MAXE);let qid=1,qn=0;
function gh(ix,iy){return ((ix*73856093)^(iy*19349663))&(GSZ-1);}
function buildGrid(){ghead.fill(-1);for(let i=0;i<MAXE;i++){if(!eact[i])continue;const h=gh(Math.floor(ex[i]/GC),Math.floor(ey[i]/GC));gnext[i]=ghead[h];ghead[h]=i;}}
function query(x,y,r){qid++;qn=0;const x0=Math.floor((x-r)/GC),x1=Math.floor((x+r)/GC),y0=Math.floor((y-r)/GC),y1=Math.floor((y+r)/GC);
  for(let iy=y0;iy<=y1;iy++)for(let ix=x0;ix<=x1;ix++){let i=ghead[gh(ix,iy)];while(i>=0){if(stamp[i]!==qid){stamp[i]=qid;qbuf[qn++]=i;}i=gnext[i];}}return qn;}

/* ---------- プレイヤー ---------- */
const P={x:0,y:0,hp:300,mhp:300,inv:0,face:0,walk:0,r:11,dead:0};
let camx=0,camy=0,shake=0,hitstop=0,kills=0,tapB=0,tickN=0,simT=0,pulseId=1;
const NUM=()=>NUMS[S.num];

/* ---------- 入力 ---------- */
const ptrs=new Map();let stick={on:0,id:-1,ox:0,oy:0,x:0,y:0,vx:0,vy:0};const keys={};
function pd(e){if(e.target!==cv)return;e.preventDefault();
  if(e.clientX<W*.5&&!stick.on){stick.on=1;stick.id=e.pointerId;stick.ox=stick.x=e.clientX;stick.oy=stick.y=e.clientY;}
  else tap(e.clientX,e.clientY);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}}
function pm(e){if(stick.on&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;}}
function pu(e){if(stick.on&&e.pointerId===stick.id){stick.on=0;stick.vx=stick.vy=0;}}
cv.addEventListener('pointerdown',pd);cv.addEventListener('pointermove',pm);cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')tap(W*.75,H*.5);});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
function tap(x,y){tapB=Math.min(1,tapB+.14);if(pn<MAXP-3){const wx=camx+(x-W/2)/Z,wy=camy+(y-H/2)/Z;for(let i=0;i<3;i++)spawnP(wx,wy,2,(Math.random()-.5)*120,(Math.random()-.5)*120,.25,3);}}

/* ---------- 生成 ---------- */
function spawnP(x,y,cl,vx,vy,life,sz){if(pn>=LV[ql].p||pn>=MAXP)return;const i=pn++;px_[i]=x;py_[i]=y;pvx[i]=vx;pvy[i]=vy;plf[i]=life;pcl[i]=cl;psz[i]=sz;}
function burst(x,y,n,cl,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.4+Math.random()*.8);spawnP(x,y,cl,Math.cos(a)*s,Math.sin(a)*s,life*(.6+Math.random()*.6),1.5+Math.random()*1.5);}}
function spawnNum(x,y,v,crit){const L=LV[ql];
  if(ql>=1&&!crit&&Math.random()<(ql===1?.4:ql===2?.7:.9))return;
  if(ql>=3&&!crit)return;
  if(ncount>=L.n&&!crit)return;
  const i=nptr;nptr=(nptr+1)%MAXN;nx[i]=x+(Math.random()-.5)*14;ny[i]=y-8;nlf[i]=.75;ncr[i]=crit?1:0;nsz[i]=crit?26:16;nstr[i]=fmt(v);ncount=Math.min(MAXN,ncount+1);}
function spawnE(){
  let i=-1;for(let k=0;k<MAXE;k++){const j=(eptr+k)%MAXE;if(!eact[j]){i=j;eptr=j+1;break;}}if(i<0)return;
  const rr=Math.random(),t=rr<.5?0:rr<.8?1:rr<.94?2:3;const a=Math.random()*6.283,ca=Math.abs(Math.cos(a))+1e-4,sa=Math.abs(Math.sin(a))+1e-4,d=Math.min((VW/2+30)/ca,(VH/2+30)/sa)+Math.random()*50;
  ex[i]=P.x+Math.cos(a)*d;ey[i]=P.y+Math.sin(a)*d;ety[i]=t;eph[i]=Math.random()*6.283;ehp[i]=ET[t].hp*NUM();ekx[i]=eky[i]=0;efl[i]=0;ecd[i]=0;epl[i]=0;eact[i]=1;ealive++;}
function clearE(){eact.fill(0);ealive=0;}
function kill(i){eact[i]=0;ealive--;kills++;burst(ex[i],ey[i],ety[i]>=2?10:6,ety[i]===3?1:ety[i]===0?5:4,140,.45);}
function hitE(i,dmg,kx,ky,crit){
  if(dmg>1e15)dmg=1e15;ehp[i]-=dmg;efl[i]=.09;ekx[i]+=kx;eky[i]+=ky;spawnNum(ex[i],ey[i]-ET[ety[i]].r,dmg,crit);
  if(pn<MAXP-4)burst(ex[i],ey[i],crit?4:2,crit?1:0,90,.25);
  if(ehp[i]<=0)kill(i);}
function nearest(x,y,maxd){let b=-1,bd=maxd*maxd;for(let i=0;i<MAXE;i++){if(!eact[i])continue;const dx=ex[i]-x,dy=ey[i]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i;}}return b;}

/* ---------- 武器 ---------- */
const WP=[{type:0,pow:1,cd:.5,ph:0,orb:0,pt:1.2,pr:-1,swT:0,swA:0,swD:1,swH:.78,aim:0,rc:0,pid:0},{type:0,pow:.6,cd:.9,ph:2,orb:0,pt:2,pr:-1,swT:0,swA:0,swD:-1,swH:.78,aim:0,rc:0,pid:0}];
function setW(){WP[0].type=S.main;WP[0].pow=1;WP[1].type=S.sub;WP[1].pow=.6;for(const w of WP){w.cd=.3;w.pr=-1;w.swT=0;w.rc=0;}}
function swing(w){

/* ---------- ガバナ・ベンチ ---------- */
const fb=new Float32Array(180),wb=new Float32Array(180);let fbn=0,fbi=0,okStreak=0,evalN=0;
let bench=null;let lastRender=0,lastFrame=0,workNow=0;
function startBench(){
  bench={st:0,t:0,res:[],save:{n:S.n,gov:S.gov,inv:S.inv},dts:[],wks:[],maxq:0};
  S.gov=0;S.inv=1;setQ(0);setN(30);syncUI();showMsg('ベンチ中… 触らずにお待ちください',1e9);
}
function benchStageN(){return [30,60,100,150,250][bench.st];}
function pct(a,p){const b=a.slice().sort((x,y)=>x-y);return b[Math.min(b.length-1,Math.floor(b.length*p))]||0;}
function benchFrame(dt,work){
  bench.t+=dt/1000;
  if(bench.t>1.5){bench.dts.push(dt);bench.wks.push(work);bench.maxq=Math.max(bench.maxq,ql);}
  if(bench.t>=BS+1.5){
    const d=bench.dts,w=bench.wks,av=d.reduce((a,b)=>a+b,0)/d.length,aw=w.reduce((a,b)=>a+b,0)/w.length;

    bench.st++;bench.t=0;bench.dts=[];bench.wks=[];

}
function endBench(){
  const r=bench.res,sv=bench.save;S.n=sv.n;S.gov=sv.gov;S.inv=sv.inv;save();setN(S.n);syncUI();hideMsg();
  const ua=(navigator.userAgent.match(/OS [\d_]+/)||[''])[0];

  for(const x of r)t+='敵'+x.n+': '+x.fps.toFixed(1)+'fps  p95='+x.p95.toFixed(1)+'ms  最大='+x.max.toFixed(0)+'ms  処理='+x.aw.toFixed(1)+'ms(p95 '+x.pw.toFixed(1)+')  実敵数='+x.alive+'\n';

function governor(dt){
  fb[fbi]=dt;fbi=(fbi+1)%180;fbn=Math.min(180,fbn+1);

/* ---------- シミュレーション ---------- */
function setN(n){S.n=n;save();}
function tick(dt){

  else if(stick.on){let dx=(stick.x-stick.ox),dy=(stick.y-stick.oy),d=Math.hypot(dx,dy);const m=Math.min(1,d/55);if(d>6){ix=dx/d*m;iy=dy/d*m;}}

    let dx=P.x-ex[i],dy=P.y-ey[i];const d=Math.sqrt(dx*dx+dy*dy)||1;
    const rate=ety[i]===1?10:ety[i]===2?4.6:ety[i]===3?5.5:6.2;eph[i]+=dt*rate;const hh=Math.sin(eph[i]),mf=hh>0?4*hh*hh:.05;

    const n=query(ax[i],ay[i],26);

      let seen=0;for(let k=0;k<4;k++)if(ahit[i*4+k]===j)seen=1;if(seen)continue;
      ahit[i*4+(4-apr[i])]=j;apr[i]--;const crit=Math.random()<.2;const l=Math.hypot(avx[i],avy[i]);hitE(j,adm[i]*(crit?2:1),avx[i]/l*70,avy[i]/l*70,crit);if(apr[i]<=0)alife[i]=0;}}

   cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(x,y+13,9,3.5,0,0,7);cx.fill();
   cx.strokeStyle='#e9f0ff';cx.lineWidth=2.4;cx.lineCap='round';cx.beginPath();cx.moveTo(x,y-4);cx.lineTo(x,y+4);cx.moveTo(x,y+4);cx.lineTo(x-w,y+12);cx.moveTo(x,y+4);cx.lineTo(x+w,y+12);cx.moveTo(x,y-2);cx.lineTo(x+Math.cos(P.face)*9,y-2+Math.sin(P.face)*9);cx.stroke();

/* ---------- ループ ---------- */
let acc=0,last=performance.now(),dbgT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(paused||H>W){last=now;return;}
  const dt=Math.min(100,now-last);
  if(now-lastRender<14.5&&!bench)return;   // 120Hz端末は60fpsで頭打ち
  last=now;
  const w0=performance.now();
  acc+=dt/1000;let steps=0;while(acc>=1/60&&steps<5){tick(1/60);acc-=1/60;steps++;}if(steps>=5)acc=0;
  render();
  const work=performance.now()-w0;
  const fd=lastRender?now-lastRender:16.7;lastRender=now;workNow=work;
  wb[fbi]=work;governor(fd);
  if(bench)benchFrame(fd,work);
  if(now-dbgT>250){dbgT=now;dbgUpdate(now);}
}
let wsum=0;
function dbgUpdate(){
  let s=0,n=Math.min(60,fbn),mx=0;for(let i=0;i<n;i++){const v=fb[(fbi-1-i+180)%180];s+=v;if(v>mx)mx=v;}const av=n?s/n:16.7;
  let ws=0;for(let i=0;i<n;i++)ws+=wb[(fbi-1-i+180)%180];
  let na=0;for(let i=0;i<MAXA;i++)if(alife[i]>0)na++;
  $('dbg').textContent=(S.panel?(VER+'\n'+(1000/av).toFixed(0)+'fps  '+av.toFixed(1)+'ms(最大'+mx.toFixed(0)+')  処理'+(n?ws/n:0).toFixed(1)+'ms\n敵'+ealive+'/'+S.n+' 矢'+na+' 粒'+pn+' 数字'+ncount+'\n品質Q'+ql+(S.gov?'(自動)':'(固定)')+' 解像度'+RS.toFixed(2)+' DPR'+DPR+'\n'+(bench?('ベンチ '+(bench.st+1)+'/5 敵'+benchStageN()):'')):'');
}

/* ---------- UI ---------- */
function showMsg(t,ms){const m=$('msg');m.textContent=t;m.style.display='flex';clearTimeout(showMsg.t);if(ms<1e8)showMsg.t=setTimeout(hideMsg,ms);}
function hideMsg(){$('msg').style.display='none';}
function syncUI(){
  document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.n));
  $('bMain').textContent=WNAME[S.main]+' ▶';$('bSub').textContent=WNAME[S.sub]+' ▶';$('bNum').textContent=NUMLAB[S.num]+' ▶';
  $('bGov').textContent='品質自動:'+(S.gov?'ON':'OFF');$('bGov').classList.toggle('on',!!S.gov);
  $('bInv').textContent='無敵:'+(S.inv?'ON':'OFF');$('bInv').classList.toggle('on',!!S.inv);
  $('body').style.display=S.panel?'flex':'none';
}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{setN(+b.dataset.n);syncUI();});
$('bMain').onclick=()=>{S.main=(S.main+1)%3;setW();save();syncUI();};
$('bSub').onclick=()=>{S.sub=(S.sub+1)%3;setW();save();syncUI();};
$('bNum').onclick=()=>{S.num=(S.num+1)%NUMS.length;clearE();save();syncUI();};
$('bGov').onclick=()=>{S.gov^=1;if(!S.gov)setQ(0);save();syncUI();};
$('bInv').onclick=()=>{S.inv^=1;save();syncUI();};
$('bBench').onclick=()=>{if(!bench)startBench();};
$('bHud').onclick=()=>{S.panel^=1;save();syncUI();};
$('tg').onclick=()=>{S.panel^=1;save();syncUI();};
$('rc').onclick=async()=>{try{await navigator.clipboard.writeText($('rt').value);$('rc').textContent='コピーしました';}catch(e){$('rt').select();$('rc').textContent='長押しでコピーしてください';}};
$('rx').onclick=()=>{$('res').style.display='none';$('rc').textContent='コピー';};
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=performance.now();acc=0;});

applySize();setW();syncUI();
if(qs.get('autobench'))setTimeout(startBench,300);
requestAnimationFrame(frame);
window.__wi={S,P,get ealive(){return ealive;},get kills(){return kills;},get bench(){return bench;}};
}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
gate();
})();
</script>
